# taxman — self-hosted Irish investment-tax ledger.
#
# Deploy on the homelab:
#   git clone <repo> ~/services/taxman
#   cd ~/services/taxman
#   cp .env.prod.example .env.prod   # optional; only for TAXMAN_FINNHUB_TOKEN
#   docker compose up -d --build
#
# The port is published on the host at :8088 (e.g. http://192.168.1.10:8088/).
# taxman has no auth of its own and is deliberately NOT on npm_network:
# there is no public hostname and no Cloudflare/NPM/Authelia path. Reach
# it over the LAN or the tailnet; keep it off the public internet.
#
# One-off CLI commands run against the same database volume, e.g.:
#   docker compose exec taxman taxman classify --list-unclassified
#   docker compose run --rm taxman import /imports/degiro.csv
services:
  taxman:
    build:
      context: .
      dockerfile: Dockerfile
    image: taxman:local
    container_name: taxman
    restart: unless-stopped
    # .env.prod is optional — the app runs without it. It only carries
    # TAXMAN_FINNHUB_TOKEN (and any TAXMAN_*_RATE overrides).
    env_file:
      - path: .env.prod
        required: false
    volumes:
      # SQLite database + WAL. This is the only stateful thing taxman has.
      - taxman_data:/data
      # Drop broker CSV exports here on the host, then
      # `docker compose exec taxman taxman import /imports/<file>.csv`.
      - ./imports:/imports:ro
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  taxman_data:
