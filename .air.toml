# air config for `make dev` — hot-reloads `taxman serve` on source
# changes. See https://github.com/air-verse/air.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/taxman ./cmd/taxman"
  entrypoint = "./tmp/taxman"
  args_bin = ["serve"]
  # only .go files trigger a rebuild — SQL migrations, fixtures, and
  # docs changing shouldn't restart the server.
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "testdata", "docs", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
